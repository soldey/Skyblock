name: Release

# Every push to main is inspected: if it carries a feat/fix/release commit, the version is
# bumped accordingly, the .mrpack is built, a GitHub release is published and the same file is
# uploaded to Modrinth. Pushes that only contain other commits do nothing.
#
# The manual run is for when Modrinth failed half-way or a release is wanted without a new
# commit: leave the version empty to work it out from the commits, or type one to force it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (empty = work it out from the commits)
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Referenced in an `if:`, which cannot read `secrets` directly.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        env:
          FORCED: ${{ inputs.version }}
        run: |
          chmod +x scripts/*.sh
          version="${FORCED:-$(scripts/next-version.sh)}"
          if [ -z "$version" ]; then
            echo "No feat/fix/release commit since the last tag, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Next version: $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the modpack
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/build-mrpack.py "$VERSION" dist

      # A manual re-run for a version that is already tagged skips straight to Modrinth.
      - name: Publish the GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME=$(jq -r .name pack.json)
          scripts/changelog.sh "v$VERSION" > dist/notes.md
          cat dist/notes.md
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged, leaving the GitHub release as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$NAME $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" dist/*.mrpack \
            --title "$NAME $VERSION" \
            --notes-file dist/notes.md

      # Skipped silently until the MODRINTH_PROJECT_ID variable and the MODRINTH_TOKEN secret
      # are set on the repository, so the GitHub release never depends on Modrinth being set up.
      - name: Publish to Modrinth
        if: steps.version.outputs.skip != 'true' && vars.MODRINTH_PROJECT_ID != '' && env.MODRINTH_TOKEN != ''
        env:
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          file=$(ls dist/*.mrpack)
          jq -n \
            --arg project "$PROJECT_ID" \
            --arg version "$VERSION" \
            --rawfile changelog dist/notes.md \
            --slurpfile deps dist/dependencies.json \
            --slurpfile pack pack.json \
            '{
              project_id: $project,
              name: "\($pack[0].name) \($version)",
              version_number: $version,
              changelog: $changelog,
              dependencies: $deps[0],
              game_versions: [$pack[0].minecraft],
              loaders: ["fabric"],
              version_type: "release",
              featured: true,
              status: "listed",
              file_parts: ["file"],
              primary_file: "file"
            }' > dist/version.json
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $GITHUB_REPOSITORY (github.com/$GITHUB_REPOSITORY)" \
            -F "data=<dist/version.json;type=application/json" \
            -F "file=@$file;type=application/x-modrinth-modpack+zip"
